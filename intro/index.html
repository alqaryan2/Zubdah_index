<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introductory Video</title>
<style>
    body, html { 
        margin: 0; 
        padding: 0; 
        width: 100%; 
        height: 100%; 
        overflow: hidden; 
        background-color: #000; /* Keeps the background black for any empty space */
        display: flex;
        justify-content: center;
        align-items: center;
    }
    video { 
        max-width: 100%; 
        max-height: 100%; 
        width: auto;
        height: auto;
        object-fit: contain; /* This "contains" the video within the screen without stretching */
    }
</style>
</head>
<body>

    <video autoplay muted playsinline loop id="introVideo">
        <source src="intro.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

</body>
</html>
