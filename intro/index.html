<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introductory Video</title>
    <style>
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            overflow: hidden; background-color: #000; 
            display: flex; justify-content: center; align-items: center; 
        }
        
        video { width: 100vw; height: 100vh; object-fit: contain; }

        /* The Big Central Button */
        #playBtn {
            position: absolute;
            z-index: 100;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 2px solid white;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        /* The Triangle Play Icon */
        #playBtn::after {
            content: "";
            display: block;
            box-sizing: border-box;
            width: 0;
            height: 40px;
            border-color: transparent transparent transparent white;
            border-style: solid;
            border-width: 20px 0 20px 30px;
            margin-left: 10px;
        }

        #playBtn:hover {
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.4);
        }

        /* Hide button class */
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <video muted playsinline loop id="introVideo" controls>
        <source src="intro.mp4" type="video/mp4">
    </video>

    <button id="playBtn" aria-label="Play Video"></button>

    <script>
        const video = document.getElementById('introVideo');
        const playBtn = document.getElementById('playBtn');

        playBtn.addEventListener('click', function() {
            video.muted = false; // Unmute
            video.currentTime = 0; // Optional: Start from beginning
            video.play();
            playBtn.classList.add('hidden'); // Remove button
        });

        // Optional: If user pauses the video using default controls, 
        // you could show the button again, but usually, leaving it hidden is better.
    </script>

</body>
</html>
